<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Class - 9°1</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- ENCABEZADO -->

    <header>
        <div class="logo">
            <div class="check">✓</div>
            <h1>CHECK CLASS</h1>
        </div>

        <div class="usuario">
            👤 &nbsp; Estudiante
        </div>
    </header>


    <!-- CURVA DEL ENCABEZADO -->

    <div class="curva">
        <div></div>
    </div>


    <!-- TITULO -->

    <section class="titulo">
        <h2>CHECK CLASS</h2>
        <h3>9°1</h3>
    </section>


    <!-- MATERIAS -->

    <section class="materias">

        <div class="columna">

            <button class="materia">
                <span>S</span>
                <b>SOCIALES</b>
            </button>

            <button class="materia">
                <span>E</span>
                <b>ÉTICA</b>
            </button>

            <button class="materia">
                <span>M</span>
                <b>MATEMÁTICAS</b>
            </button>

        </div>


        <div class="centro">
            <div class="simbolo">✓</div>
        </div>


        <div class="columna">

            <button class="materia">
                <span>I</span>
                <b>INGLÉS</b>
            </button>

            <button class="materia">
                <span>L</span>
                <b>LENGUA C.</b>
            </button>

            <button class="materia">
                <span>T</span>
                <b>TECNOLOGÍA</b>
            </button>

        </div>

    </section>


    <!-- ACTIVIDADES -->

    <section class="actividades">

        <div class="encabezado-actividad">
            <h2>SOCIALES</h2>
        </div>


        <div class="tabla">

            <div class="titulo-tabla">
                <div>RESOLVER</div>
                <div>FECHA</div>
            </div>


            <div class="fila">
                <div class="actividad">ACTIVIDAD 1</div>
                <div class="fecha">30/OCT/26</div>
                <button>RESOLVER</button>
            </div>


            <div class="fila">
                <div class="actividad">ACTIVIDAD 2</div>
                <div class="fecha">30/OCT/26</div>
                <button>RESOLVER</button>
            </div>


            <div class="fila">
                <div class="actividad">ACTIVIDAD 3</div>
                <div class="fecha">30/OCT/26</div>
                <button>RESOLVER</button>
            </div>

        </div>

    </section>


</body>
</html>
